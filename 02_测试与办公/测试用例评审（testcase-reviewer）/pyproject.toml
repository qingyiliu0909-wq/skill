[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testcase-reviewer"
version = "0.1.0"
description = "Utilities for fetching and operating testcase platform cases."
readme = "SKILL.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9",
]

[project.scripts]
operate-case = "scripts.operate_case:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
